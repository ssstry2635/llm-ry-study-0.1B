    <text x="60" y="150" fill="#f2f5fa" font-weight="700" font-size="52">从零，训练自己的语言模型</text>
    <text x="64" y="200" fill="#abbcd1" font-size="23">Python → BPE → Transformer → Pretraining</text>
    <text x="64" y="285" fill="#f2f5fa" font-size="28" font-weight="600">110.12M</text>
    <text x="235" y="285" fill="#8092ab" font-size="18">parameters</text>
    <text x="385" y="285" fill="#f2f5fa" font-size="28" font-weight="600">8GB</text>
    <text x="465" y="285" fill="#8092ab" font-size="18">laptop GPU</text>
    <text x="630" y="285" fill="#f2f5fa" font-size="28" font-weight="600">15,000</text>
    <text x="745" y="285" fill="#8092ab" font-size="18">steps</text>
  </g>
